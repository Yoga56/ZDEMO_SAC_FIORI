specVersion: "3.1"
metadata:
  name: zsac.fiori
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          # client 80 (developer extensibility): the repository is shared with client 100, so the app shows there as well. Client 100 refuses
          # an app whose OData service is not released for key users. Create this destination in BTP as a copy of my402225 with sap-client = 80.
          destination: my402225_c80
        app:
          name: ZSAC_FIORI
          description: Analytics and Planning (SAC style)
          package: ZSAC_FIORI
          # add "transport: <request>" when the system asks for one
