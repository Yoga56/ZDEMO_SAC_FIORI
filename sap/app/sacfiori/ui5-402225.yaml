# Same as ui5.yaml, but the /sap backend is the destination my402225 (the system where the CDS data and the app backend live).
specVersion: "3.1"
metadata:
  name: zsac.fiori
type: application
server:
  customMiddleware:
    - name: ui5-middleware-servestatic
      afterMiddleware: compression
      # the library is where the built app has it (resources/zsac/lib), so the manifest says the same in development and when deployed
      mountPath: /resources/zsac/lib
      configuration:
        rootPath: ../saclib/src/zsac/lib
    - name: fiori-tools-proxy
      afterMiddleware: ui5-middleware-servestatic   # after it: /resources/zsac/lib is ours, the rest of /resources goes to ui5.sap.com
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.136.12
        backend:
          - path: /sap
            destination: my402225
    - name: fiori-tools-appreload
      afterMiddleware: compression
