# No backend: UI5 from the npm registry, data from zsac.lib's MockProvider.   npm run start-mock
specVersion: "3.1"
metadata:
  name: zsac.fiori
type: application
framework:
  name: OpenUI5
  version: "1.136.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-servestatic
      afterMiddleware: compression
      mountPath: /zsac/lib
      configuration:
        rootPath: ../saclib/src/zsac/lib
